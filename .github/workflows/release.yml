name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
    DOTNET_VERSION: '10.0.x'
    DOTNET_HUMAN: '10.0'

jobs:
    determine-version:
        name: Determine version
        runs-on: windows-latest
        steps:
          - name: Determine version
            id: version
            run: |
                if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.version }}' -ne '') {  
                    echo "version=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT  
                } elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -match '^refs/tags/v(.*)$') {  
                    echo "version=$($matches[1])" >> $env:GITHUB_OUTPUT  
                }
            shell: pwsh
        outputs:
            version: ${{ steps.version.outputs.version }}

    build-installer-windows:
        name: Windows Installer
        runs-on: windows-latest
        needs: [determine-version]
        permissions:
          contents: read

        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
                submodules: recursive # Not required, but just in case
          - name: Setup .NET
            uses: actions/setup-dotnet@v4
            with:
                dotnet-version: ${{ env.DOTNET_VERSION }}
          - name: Restore
            run: dotnet restore
          - name: Build
            run: |
                dotnet publish DumpDNS/DumpDNS.csproj `
                    -c Release `
                    -r win-x64 `
                    -p:Version="${{ needs.determine-version.outputs.version }}" `
                    -p:AssemblyVersion="${{ needs.determine-version.outputs.version }}" `
                    -p:FileVersion="${{ needs.determine-version.outputs.version }}" `
                    -p:InformationalVersion="${{ needs.determine-version.outputs.version }}" `
                    -p:PublishSingleFile=true `
                    --self-contained true `
                    -o Publish
          - name: Build installer with Inno Setup
            run: |
                $env:DUMPDNS_VERSION = "${{ needs.determine-version.outputs.version }}"
                iscc setup.iss
            shell: pwsh
          - name: Upload Windows installer
            uses: actions/upload-artifact@v4
            with:
                name: installer-windows
                path: output/DumpDNS-*.exe
                retention-days: 30
    
    build-binaries:
        name: Build (${{ matrix.rid }})
        runs-on: ${{ matrix.os }}
        needs: [determine-version]
        permissions:
          contents: read

        strategy:
            fail-fast: false
            matrix:
                include:
                  - os: windows-latest
                    rid: win-x64

                  - os: windows-latest
                    rid: win-arm64

                  - os: ubuntu-latest
                    rid: linux-x64

                  - os: ubuntu-latest
                    rid: linux-arm64

                #  - os: macos-13
                #    rid: osx-x64

                  - os: macos-latest
                    rid: osx-arm64

        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
                submodules: recursive # Not required, but just in case
          - name: Setup .NET
            uses: actions/setup-dotnet@v4
            with:
                dotnet-version: ${{ env.DOTNET_VERSION }}
          - name: Restore
            run: dotnet restore

            # Build stuff
          - name: Build framework-dependent
            shell: bash
            run: |
                dotnet publish DumpDNS/DumpDNS.csproj \
                    -c Release \
                    -r ${{ matrix.rid }} \
                    -p:Version="${{ needs.determine-version.outputs.version }}" \
                    -p:AssemblyVersion="${{ needs.determine-version.outputs.version }}" \
                    -p:FileVersion="${{ needs.determine-version.outputs.version }}" \
                    -p:InformationalVersion="${{ needs.determine-version.outputs.version }}" \
                    -p:PublishSingleFile=true \
                    -o Publish/framework \
                    --self-contained false

          - name: Build self-contained
            shell: bash
            run: |
                dotnet publish DumpDNS/DumpDNS.csproj \
                    -c Release \
                    -r ${{ matrix.rid }} \
                    -p:Version="${{ needs.determine-version.outputs.version }}" \
                    -p:AssemblyVersion="${{ needs.determine-version.outputs.version }}" \
                    -p:FileVersion="${{ needs.determine-version.outputs.version }}" \
                    -p:InformationalVersion="${{ needs.determine-version.outputs.version }}" \
                    -p:PublishSingleFile=true \
                    -o Publish/self-contained \
                    --self-contained true

            # Archive stuff
          - name: Archive (Windows)
            if: runner.os == 'Windows'
            shell: pwsh
            run: |
                Compress-Archive `
                    -Path Publish/framework/* `
                    -DestinationPath DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}.zip
                
                Compress-Archive `
                    -Path Publish/self-contained/* `
                    -DestinationPath DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}-self-contained.zip

          - name: Archive (Unix)
            if: runner.os != 'Windows'
            shell: bash
            run: |
                tar -czf DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}.tar.gz \
                    -C Publish/framework .
                
                tar -czf DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}-self-contained.tar.gz \
                    -C Publish/self-contained .

            # Upload stuff
          - name: Upload framework-dependent
            uses: actions/upload-artifact@v4
            with:
                name: DumpDNS-${{ matrix.rid }}
                path: |
                    DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}.zip
                    DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}.tar.gz
                retention-days: 30

          - name: Upload self-contained
            uses: actions/upload-artifact@v4
            with:
                name: DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}-self-contained
                path: |
                    DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}-self-contained.zip
                    DumpDNS-${{ needs.determine-version.outputs.version }}-${{ matrix.rid }}-self-contained.tar.gz
                retention-days: 30

    create-release:
        name: Create Release
        needs: [determine-version, build-installer-windows, build-binaries]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
          - name: Download all installer artifacts
            uses: actions/download-artifact@v4
            with:
                path: installers
                merge-multiple: false
          - name: Create Release
            uses: softprops/action-gh-release@v2
            with:
                name: "DumpDNS ${{ needs.determine-version.outputs.version }}"
                body: |
                    ## DumpDNS ${{ needs.determine-version.outputs.version }}

                    ### Downloads

                    | Platform | File | Notes |
                    |----------|------|-------|
                    | Windows | `DumpDNS-${{ needs.determine-version.outputs.version }}-setup.exe` | Run the installer, requires the .NET ${{ env.DOTNET_HUMAN }} Runtime |
                    | Windows (x64) | `DumpDNS-${{ needs.determine-version.outputs.version }}-win-x64.exe` |  |
                    | Windows (x64 self-contained) | `DumpDNS-${{ needs.determine-version.outputs.version }}-win-x64-self-contained.zip` |  |
                    | Windows (arm64) | `DumpDNS-${{ needs.determine-version.outputs.version }}-win-arm64.zip` |  |
                    | Windows (arm64 self-contained) | `DumpDNS-${{ needs.determine-version.outputs.version }}-win-arm64-self-contained.zip` |  |
                    | Linux (x64) | `DumpDNS-${{ needs.determine-version.outputs.version }}-linux-x64.tar.gz` |  |
                    | Linux (x64 self-contained) | `DumpDNS-${{ needs.determine-version.outputs.version }}-linux-x64-self-contained.tar.gz` |  |
                    | Linux (arm64) | `DumpDNS-${{ needs.determine-version.outputs.version }}-linux-arm64.tar.gz` |  |
                    | Linux (arm64 self-contained) | `DumpDNS-${{ needs.determine-version.outputs.version }}-linux-arm64-self-contained.tar.gz` |  |
                    | OSX (arm64) | `DumpDNS-${{ needs.determine-version.outputs.version }}-osx-arm64.tar.gz` |  |
                    | OSX (arm64 self-contained) | `DumpDNS-${{ needs.determine-version.outputs.version }}-osx-arm64-self-contained.tar.gz` |  |

                    ### Prerequisites

                    - [.NET ${{ env.DOTNET_HUMAN }} Runtime](https://dot.net/download)
                      - If you install a version with "self-contained" in the name, you do not need this.
                draft: false
                prerelease: false
                files: |
                    installers/**/*